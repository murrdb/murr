openapi: "3.1.0"
info:
  title: Murr API
  description: Columnar in-memory cache for AI/ML inference workloads
  version: 0.1.0

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /openapi.json:
    get:
      summary: OpenAPI schema
      operationId: openapi
      responses:
        "200":
          description: OpenAPI spec as JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/table:
    get:
      summary: List all tables
      operationId: listTables
      responses:
        "200":
          description: Map of table name to schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TableSchema"

  /api/v1/table/{name}:
    put:
      summary: Create a table
      operationId: createTable
      parameters:
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSchema"
      responses:
        "201":
          description: Table created
        "409":
          description: Table already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Drop a table
      operationId: dropTable
      description: Removes the table, its data, and its manifest entry. The name can be reused afterwards.
      parameters:
        - $ref: "#/components/parameters/TableName"
      responses:
        "204":
          description: Table dropped
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/table/{name}/schema:
    get:
      summary: Get table schema
      operationId: getSchema
      parameters:
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: Table schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSchema"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/table/{name}/fetch:
    post:
      summary: Fetch data from a table
      operationId: fetch
      description: |
        Retrieves specific columns for a batch of keys. Keys are columnar: one
        array per key column of the table, all of the same length. Row i of the
        response answers row i of the keys; missing keys come back as nulls.
        Request format depends on the Content-Type header, response format on
        the Accept header.
      parameters:
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchRequest"
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: |
                Arrow IPC stream whose columns are exactly the key columns of the
                table, typed as declared in the table schema. The columns to return
                are a JSON array of names in the `columns` entry of the stream
                schema metadata.
      responses:
        "200":
          description: Fetched data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                format: binary
                description: Arrow IPC stream containing a RecordBatch
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/table/{name}/write:
    put:
      summary: Write data to a table
      operationId: writeTable
      description: |
        Writes columnar data as a new segment. Request format depends on
        the Content-Type header. Supports JSON columnar format or Arrow IPC.
      parameters:
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRequest"
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: Arrow IPC stream containing a RecordBatch
      responses:
        "200":
          description: Data written
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    TableName:
      name: name
      in: path
      required: true
      schema:
        type: string

  schemas:
    DType:
      type: string
      enum:
        - utf8
        - bool
        - int8
        - int16
        - int32
        - int64
        - uint8
        - uint16
        - uint32
        - uint64
        - float32
        - float64

    ColumnSchema:
      type: object
      required: [dtype]
      additionalProperties: false
      properties:
        dtype:
          $ref: "#/components/schemas/DType"
        nullable:
          type: boolean
          default: true
        key:
          type: boolean
          default: false
          description: |
            Marks the column as part of the table key. Key columns must be utf8
            or an integer dtype and must set `nullable: false`.
        strict:
          type: boolean
          default: true
          description: |
            A strict column accepts only Arrow types that cast to its dtype with
            no change of a value, `int32` into `int64` for example. With `false`,
            a `float32` column also accepts `float64` and rounds the values.

    TableSchema:
      type: object
      required: [columns]
      additionalProperties: false
      description: |
        At least one column must be a key. Several key columns form a compound
        key, in the order they are listed.
      properties:
        columns:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnSchema"

    FetchRequest:
      type: object
      required: [keys, columns]
      additionalProperties: false
      properties:
        keys:
          type: object
          description: One array of values per key column of the table.
          additionalProperties:
            type: array
            items: {}
        columns:
          type: array
          items:
            type: string

    FetchResponse:
      type: object
      required: [columns]
      properties:
        columns:
          type: object
          additionalProperties:
            type: array
            items: {}

    WriteRequest:
      type: object
      required: [columns]
      properties:
        columns:
          type: object
          additionalProperties:
            type: array
            items: {}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
